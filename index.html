<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORTIS 노래 소터</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#14181a;--sub:#6b7378;--ac:#1fa35a;--bd:#dde1dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101412;--card:#1a1f1c;--tx:#eef2ee;--sub:#97a19b;--ac:#3ddc84;--bd:#2b332e}}
:root[data-theme="dark"]{--bg:#101412;--card:#1a1f1c;--tx:#eef2ee;--sub:#97a19b;--ac:#3ddc84;--bd:#2b332e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.row{display:flex;gap:10px}
.opt{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:26px 10px;text-align:center;font-size:16px;font-weight:700;color:var(--tx);cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.opt small{font-weight:400;color:var(--sub);font-size:12px}
.opt:active{border-color:var(--ac);transform:scale(.98)}
.sm{display:flex;gap:8px;margin-top:12px}
.sm button,.btn{flex:1;background:transparent;border:1px solid var(--bd);color:var(--sub);border-radius:10px;padding:11px;font-size:14px;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
ol{padding-left:0;list-style:none;margin:12px 0}
li{display:flex;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:6px}
li b{width:28px;color:var(--ac)}
li small{color:var(--sub);margin-left:auto;font-size:12px}
.hide{display:none}
textarea{width:100%;height:90px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:13px}
</style>
</head>
<body>
<h1>🟢 CORTIS 노래 소터</h1>
<div class="sub" id="info">더 좋아하는 곡을 골라줘</div>

<div id="start">
  <div class="sub">앨범 선택</div>
  <label><input type="checkbox" class="alb" value="COLOR OUTSIDE THE LINES" checked> COLOR OUTSIDE THE LINES (2025)</label><br>
  <label><input type="checkbox" class="alb" value="GREENGREEN" checked> GREENGREEN (2026)</label><br><br>
  <button class="btn p" id="go" style="width:100%">시작</button>
</div>

<div id="play" class="hide">
  <div class="bar"><i id="pb"></i></div>
  <div class="row">
    <button class="opt" id="a"></button>
    <button class="opt" id="b"></button>
  </div>
  <div class="sm">
    <button id="tie">둘 다 좋아 / 모르겠어</button>
    <button id="undo">되돌리기</button>
  </div>
</div>

<div id="res" class="hide">
  <ol id="list"></ol>
  <div class="sm"><button id="copy">결과 텍스트 복사</button><button id="again">다시</button></div>
  <textarea id="txt" class="hide" readonly></textarea>
</div>

<script>
// 곡 목록 — 여기만 고치면 됨
const SONGS=[
 {t:"GO!",a:"COLOR OUTSIDE THE LINES"},
 {t:"What You Want",a:"COLOR OUTSIDE THE LINES"},
 {t:"FaSHioN",a:"COLOR OUTSIDE THE LINES"},
 {t:"JoyRide",a:"COLOR OUTSIDE THE LINES"},
 {t:"Lullaby",a:"COLOR OUTSIDE THE LINES"},
 {t:"What You Want (feat. Teezo Touchdown)",a:"COLOR OUTSIDE THE LINES"},
 {t:"REDRED",a:"GREENGREEN"},
 {t:"TNT",a:"GREENGREEN"},
 {t:"ACAI",a:"GREENGREEN"},
 {t:"YOUNGCREATORCREW",a:"GREENGREEN"},
 {t:"Wassup",a:"GREENGREEN"},
 {t:"Blue Lips",a:"GREENGREEN"}
];
const $=id=>document.getElementById(id);
let hist=[],st=null;

// 병합정렬을 "상태 머신"으로: 한 번에 한 비교씩 진행
function init(items){
  items=items.map(x=>x).sort(()=>Math.random()-.5);
  st={q:items.map(x=>[x]),cur:null,i:0,j:0,out:[],done:0,total:est(items.length),ties:[]};
  next();
}
function est(n){let s=0;(function f(k){if(k<2)return;const h=k>>1;f(h);f(k-h);s+=k-1})(n);return s}
function next(){
  // 현재 병합 쌍이 없으면 큐에서 꺼냄
  while(true){
    if(!st.cur){
      if(st.q.length===1){return finish(st.q[0])}
      const L=st.q.shift(),R=st.q.shift();
      st.cur={L,R};st.i=0;st.j=0;st.out=[];
    }
    const{L,R}=st.cur;
    if(st.i>=L.length||st.j>=R.length){
      st.out.push(...L.slice(st.i),...R.slice(st.j));
      st.q.push(st.out);st.cur=null;continue;
    }
    break;
  }
  const{L,R}=st.cur;
  $("a").innerHTML=lab(L[st.i]);$("b").innerHTML=lab(R[st.j]);
  $("pb").style.width=Math.min(100,st.done/st.total*100)+"%";
  $("info").textContent=`진행 ${Math.min(100,Math.round(st.done/st.total*100))}%`;
}
function lab(s){return s.t+"<small>"+s.a+"</small>"}
function snap(){return JSON.stringify(st)}
function pick(side){
  hist.push(snap());
  const{L,R}=st.cur;
  if(side==="a"){st.out.push(L[st.i++])}
  else if(side==="b"){st.out.push(R[st.j++])}
  else{st.out.push(L[st.i++]);st.out.push(R[st.j++])}
  st.done++;next();
}
function finish(r){
  $("play").classList.add("hide");$("res").classList.remove("hide");
  $("info").textContent="결과";
  $("list").innerHTML=r.map((s,i)=>`<li><b>${i+1}</b>${s.t}<small>${s.a}</small></li>`).join("");
  $("txt").value="CORTIS 노래 순위\n"+r.map((s,i)=>`${i+1}. ${s.t}`).join("\n");
}
$("go").onclick=()=>{
  const al=[...document.querySelectorAll(".alb:checked")].map(e=>e.value);
  const items=SONGS.filter(s=>al.includes(s.a));
  if(items.length<2)return;
  hist=[];$("start").classList.add("hide");$("play").classList.remove("hide");init(items);
};
$("a").onclick=()=>pick("a");$("b").onclick=()=>pick("b");$("tie").onclick=()=>pick("t");
$("undo").onclick=()=>{if(!hist.length)return;st=JSON.parse(hist.pop());next()};
$("copy").onclick=()=>{const t=$("txt");t.classList.remove("hide");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}};
$("again").onclick=()=>{$("res").classList.add("hide");$("txt").classList.add("hide");$("start").classList.remove("hide")};
</script>
</body>
</html>
