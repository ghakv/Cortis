<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORTIS 노래 소트</title>
<script type="text/javascript">
//*********************************************************
// 곡 목록 — 여기만 고치면 됨
// 따옴표(")로 감싸고 쉼표(,)로 구분. 마지막 줄은 쉼표 X
//*********************************************************
var namMember = new Array(
"GO!",
"What You Want",
"FaSHioN",
"JoyRide",
"Lullaby",
"What You Want (feat. Teezo Touchdown)",
"Mention Me",
"REDRED",
"TNT",
"ACAI",
"YOUNGCREATORCREW",
"Wassup",
"Blue Lips"
"Motion (feat. Juicy J)",
"MONEYMONEYMONEY",
"PACK IT UP"
);
//*********************************************************

var lstMember = new Array();
var parentIdx = new Array();
var equal = new Array();
var rec = new Array();
var cmp1,cmp2;
var head1,head2;
var nrec;

var numQuestion;
var totalSize;
var finishSize;
var finishFlag;

//변수 초기화
function initList(){
var n = 0;
var mid;
var i;

lstMember[n] = new Array();
for (i=0; i<namMember.length; i++) {
lstMember[n][i] = i;
}
parentIdx[n] = -1;
totalSize = 0;
n++;

for (i=0; i<lstMember.length; i++) {
if(lstMember[i].length>=2) {
mid = Math.ceil(lstMember[i].length/2);
lstMember[n] = new Array();
lstMember[n] = lstMember[i].slice(0,mid);
totalSize += lstMember[n].length;
parentIdx[n] = i;
n++;
lstMember[n] = new Array();
lstMember[n] = lstMember[i].slice(mid,lstMember[i].length);
totalSize += lstMember[n].length;
parentIdx[n] = i;
n++;
}
}

for (i=0; i<namMember.length; i++) {
rec[i] = 0;
}
nrec = 0;

for (i=0; i<=namMember.length; i++) {
equal[i] = -1;
}

cmp1 = lstMember.length-2;
cmp2 = lstMember.length-1;
head1 = 0;
head2 = 0;
numQuestion = 1;
finishSize = 0;
finishFlag = 0;
}

//flag: -1 왼쪽 / 0 동점 / 1 오른쪽
function sortList(flag){
var i;
var str;

if (flag<0) {
rec[nrec] = lstMember[cmp1][head1];
head1++;
nrec++;
finishSize++;
while (equal[rec[nrec-1]]!=-1) {
rec[nrec] = lstMember[cmp1][head1];
head1++;
nrec++;
finishSize++;
}
}
else if (flag>0) {
rec[nrec] = lstMember[cmp2][head2];
head2++;
nrec++;
finishSize++;
while (equal[rec[nrec-1]]!=-1) {
rec[nrec] = lstMember[cmp2][head2];
head2++;
nrec++;
finishSize++;
}
}
else {
rec[nrec] = lstMember[cmp1][head1];
head1++;
nrec++;
finishSize++;
while (equal[rec[nrec-1]]!=-1) {
rec[nrec] = lstMember[cmp1][head1];
head1++;
nrec++;
finishSize++;
}
equal[rec[nrec-1]] = lstMember[cmp2][head2];
rec[nrec] = lstMember[cmp2][head2];
head2++;
nrec++;
finishSize++;
while (equal[rec[nrec-1]]!=-1) {
rec[nrec] = lstMember[cmp2][head2];
head2++;
nrec++;
finishSize++;
}
}

if (head1<lstMember[cmp1].length && head2==lstMember[cmp2].length) {
while (head1<lstMember[cmp1].length){
rec[nrec] = lstMember[cmp1][head1];
head1++;
nrec++;
finishSize++;
}
}
else if (head1==lstMember[cmp1].length && head2<lstMember[cmp2].length) {
while (head2<lstMember[cmp2].length){
rec[nrec] = lstMember[cmp2][head2];
head2++;
nrec++;
finishSize++;
}
}

if (head1==lstMember[cmp1].length && head2==lstMember[cmp2].length) {
for (i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) {
lstMember[parentIdx[cmp1]][i] = rec[i];
}
lstMember.pop();
lstMember.pop();
cmp1 = cmp1-2;
cmp2 = cmp2-2;
head1 = 0;
head2 = 0;

if (head1==0 && head2==0) {
for (i=0; i<namMember.length; i++) {
rec[i] = 0;
}
nrec = 0;
}
}

if (cmp1<0) {
str = "Battle No."+(numQuestion-1)+"<br>"+Math.floor(finishSize*100/totalSize)+"% sorted.";
document.getElementById("battleNumber").innerHTML = str;

showResult();
finishFlag = 1;
}
else {
showImage();
}
}

//결과 표시
function showResult() {
var ranking = 1;
var sameRank = 1;
var str = "";
var i;

str += "<table style=\"width:260px; font-size:13px; line-height:140%; margin-left:auto; margin-right:auto; border:1px solid #000; border-collapse:collapse\" align=\"center\">";
str += "<tr><td style=\"color:#ffffff; background-color:#000; text-align:center;\">순위<\/td><td style=\"color:#ffffff; background-color:#000; text-align:center;\">이름<\/td><\/tr>";

for (i=0; i<namMember.length; i++) {
str += "<tr><td style=\"border:1px solid #000; text-align:right; padding-right:5px;\">"+ranking+"<\/td><td style=\"border:1px solid #000; padding-left:5px;\">"+namMember[lstMember[0][i]]+"<\/td><\/tr>";
if (i<namMember.length-1) {
if (equal[lstMember[0][i]]==lstMember[0][i+1]) {
sameRank++;
} else {
ranking += sameRank;
sameRank = 1;
}
}
}
str += "<\/table>";

document.getElementById("resultField").innerHTML = str;
}

//비교할 두 곡 표시
function showImage() {
var str0 = "Battle No."+numQuestion+"<br>"+Math.floor(finishSize*100/totalSize)+"% sorted.";
var str1 = ""+namMember[lstMember[cmp1][head1]];
var str2 = ""+namMember[lstMember[cmp2][head2]];

document.getElementById("battleNumber").innerHTML = str0;
document.getElementById("leftField").innerHTML = str1;
document.getElementById("rightField").innerHTML = str2;

numQuestion++;
}
</script>
<style type="text/css">
body{-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#mainTable{
font-size: 14px;
font-family: 'Apple SD Gothic Neo','Noto Sans KR','돋움',sans-serif;
text-align: center;
vertical-align: middle;
width: 100%;
max-width: 410px;
margin-left: auto;
margin-right: auto;
border-collapse: separate;
border-spacing: 10px 5px;
}
#leftField, #rightField{
width: 32%;
height: 150px;
border: 1px solid #000;
cursor: pointer;
}
.middleField{
width: 32%;
height: 70px;
border: 1px solid #000;
cursor: pointer;
}
</style>
</head>

<body text="#000000" bgcolor="#ffffff">
<table id="mainTable" align="center">
<tr>
<td id="battleNumber" colspan="3" style="padding-bottom: 10px;">&nbsp;</td>
</tr>
<tr>
<td id="leftField" onClick="if(finishFlag==0)sortList(-1);" rowspan="2">&nbsp;</td>
<td class="middleField" onClick="if(finishFlag==0)sortList(0);">둘 다 좋다</td>
<td id="rightField" onClick="if(finishFlag==0)sortList(1);" rowspan="2"></td>
</tr>
<tr>
<td class="middleField" onClick="if(finishFlag==0)sortList(0);">모르겠다</td>
</tr>
</table><br><br>
<div id="resultField" style="text-align:center;"></div>
<p style="text-align:center; font-size:13px; font-family:serif; margin-top:40px;">최종 업데이트: (26.10.29)</p>
<script type="text/javascript">
if (namMember.length < 2) {
document.getElementById("battleNumber").innerHTML = "곡을 2개 이상 넣어줘";
finishFlag = 1;
} else {
initList();
showImage();
}
</script>
</body>
</html>
